{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    {{- if not .Date.IsZero }}
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    {{- end }}
  </header>
  {{ .Content }}
</article>
{{- if eq .Section "writings" }}
<p class="back"><a href="{{ .Parent.RelPermalink }}">← All writings</a></p>
{{- end }}
{{ end }}
