{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<ul class="post-list">
  {{- range .RegularPages }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
    <div>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{- with .Description }}
      <p>{{ . }}</p>
      {{- end }}
    </div>
  </li>
  {{- end }}
</ul>
{{ end }}
